name: Windows Premium UI Verification

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  verify-premium-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-windows.txt

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install --no-deps face-recognition==1.3.0

      - name: Compile Python entry points
        run: python -m py_compile qt_cockpit.py qt_cockpit_premium.py main.py

      - name: Run premium UI contract tests
        run: python -m pytest tests/test_premium_ui_contract.py tests/test_premium_windows_routes.py -q

      - name: Run core test suite
        run: python -m pytest tests -q

      - name: Smoke-load premium pose browser QML
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python tests/smoke_premium_pose_browser.py

      - name: Smoke-load premium QML offscreen
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: |
          python qt_cockpit_premium.py --page home --width 1400 --height 900 --screenshot premium-home.png
          if (-not (Test-Path premium-home.png)) { throw 'Premium QML screenshot was not created.' }

      - name: Upload premium screenshot
        uses: actions/upload-artifact@v4
        with:
          name: premium-home
          path: premium-home.png
