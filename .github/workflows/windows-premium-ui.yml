name: Windows Premium UI Verification

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  verify-premium-ui:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-windows.txt

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install --no-deps face-recognition==1.3.0

      - name: Compile Python entry points
        run: python -m py_compile qt_cockpit.py qt_cockpit_premium.py main.py

      - name: Run premium UI contract tests
        run: python -m pytest tests/test_premium_ui_contract.py tests/test_premium_windows_routes.py -q

      - name: Run core test suite
        run: python -m pytest tests -q

      - name: Smoke-load premium pose browser QML
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python tests/smoke_premium_pose_browser.py

      - name: Render integrated premium QML screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: minimal
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: |
          python qt_cockpit_premium.py --page home --width 1400 --height 900 --screenshot premium-home.png
          if (-not (Test-Path premium-home.png)) { throw 'Premium home screenshot was not created.' }
          if ((Get-Item premium-home.png).Length -lt 1024) { throw 'Premium home screenshot is unexpectedly small.' }
          python qt_cockpit_premium.py --page poses --width 1400 --height 900 --screenshot premium-poses.png
          if (-not (Test-Path premium-poses.png)) { throw 'Premium pose screenshot was not created.' }
          if ((Get-Item premium-poses.png).Length -lt 1024) { throw 'Premium pose screenshot is unexpectedly small.' }

      - name: Build packaged premium Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name GENESIS-c0ckpit --add-data 'genesis\qt_ui;genesis\qt_ui' --add-data 'genesis\assets;genesis\assets' --add-data 'genesis\reference;genesis\reference' qt_cockpit_premium.py
          if (-not (Test-Path 'dist\GENESIS-c0ckpit\GENESIS-c0ckpit.exe')) { throw 'Packaged GENESIS executable was not created.' }

      - name: Smoke packaged premium Windows app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: minimal
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: |
          $process = Start-Process -FilePath '.\dist\GENESIS-c0ckpit\GENESIS-c0ckpit.exe' -ArgumentList '--page','home','--width','1400','--height','900','--screenshot','packaged-premium-home.png' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GENESIS exited with code $($process.ExitCode)." }
          if (-not (Test-Path packaged-premium-home.png)) { throw 'Packaged premium screenshot was not created.' }
          if ((Get-Item packaged-premium-home.png).Length -lt 1024) { throw 'Packaged premium screenshot is unexpectedly small.' }

      - name: Archive packaged Windows app
        shell: pwsh
        run: Compress-Archive -Path 'dist\GENESIS-c0ckpit\*' -DestinationPath 'GENESIS-c0ckpit-Windows.zip' -Force

      - name: Upload premium screenshots
        uses: actions/upload-artifact@v4
        with:
          name: premium-ui-screenshots
          path: |
            premium-home.png
            premium-poses.png
            packaged-premium-home.png

      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: GENESIS-c0ckpit-Windows
          path: GENESIS-c0ckpit-Windows.zip
          if-no-files-found: error
