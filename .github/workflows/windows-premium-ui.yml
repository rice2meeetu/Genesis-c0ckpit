name: Windows Premium UI Verification

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

jobs:
  verify-premium-ui:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-windows.txt

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install --no-deps face-recognition==1.3.0

      - name: Verify background removal backend
        shell: pwsh
        run: |
          python -c "from rembg import remove; import onnxruntime as ort; assert 'CPUExecutionProvider' in ort.get_available_providers(); assert callable(remove); print('rembg CPU backend ready')"

      - name: Compile Python entry points
        run: python -m py_compile qt_cockpit.py qt_cockpit_premium.py main.py

      - name: Run premium UI contract tests
        run: python -m pytest tests/test_premium_ui_contract.py tests/test_premium_windows_routes.py -q

      - name: Run core test suite
        run: python -m pytest tests -q

      - name: Smoke-load premium pose browser QML
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python tests/smoke_premium_pose_browser.py

      - name: Smoke integrated premium QML pages
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: |
          python qt_cockpit_premium.py --page home --width 1400 --height 900 --smoke
          if ($LASTEXITCODE -ne 0) { throw "Premium home smoke exited with code $LASTEXITCODE." }
          python qt_cockpit_premium.py --page poses --width 1400 --height 900 --smoke
          if ($LASTEXITCODE -ne 0) { throw "Premium pose smoke exited with code $LASTEXITCODE." }
          python qt_cockpit_premium.py --page create --width 1400 --height 900 --smoke
          if ($LASTEXITCODE -ne 0) { throw "Premium create smoke exited with code $LASTEXITCODE." }
          python qt_cockpit_premium.py --tool-smoke
          if ($LASTEXITCODE -ne 0) { throw "Source tool-host smoke exited with code $LASTEXITCODE." }

      - name: Build packaged premium Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name GENESIS-c0ckpit --collect-all rembg --add-data 'genesis\qt_ui;genesis\qt_ui' --add-data 'genesis\assets;genesis\assets' --add-data 'genesis\reference;genesis\reference' qt_cockpit_premium.py
          if (-not (Test-Path 'dist\GENESIS-c0ckpit\GENESIS-c0ckpit.exe')) { throw 'Packaged GENESIS executable was not created.' }

      - name: Smoke packaged premium Windows app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: |
          $process = Start-Process -FilePath '.\dist\GENESIS-c0ckpit\GENESIS-c0ckpit.exe' -ArgumentList '--page','home','--width','1400','--height','900','--smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged GENESIS exited with code $($process.ExitCode)." }
          $tools = Start-Process -FilePath '.\dist\GENESIS-c0ckpit\GENESIS-c0ckpit.exe' -ArgumentList '--tool-smoke' -Wait -PassThru
          if ($tools.ExitCode -ne 0) { throw "Packaged GENESIS tool host exited with code $($tools.ExitCode)." }

      - name: Archive packaged Windows app
        shell: pwsh
        run: Compress-Archive -Path 'dist\GENESIS-c0ckpit\*' -DestinationPath 'GENESIS-c0ckpit-Windows.zip' -Force

      - name: Upload packaged Windows app
        uses: actions/upload-artifact@v4
        with:
          name: GENESIS-c0ckpit-Windows
          path: GENESIS-c0ckpit-Windows.zip
          if-no-files-found: error
