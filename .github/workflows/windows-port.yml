name: Windows GENESIS Port

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "qt_cockpit_windows.py"
      - "qt_cockpit.py"
      - "qt_cockpit_linux_premium.py"
      - "launch-windows.bat"
      - "windows/**"
      - "genesis/**"
      - "tests/**"
      - ".github/workflows/windows-port.yml"
  push:
    branches: [windows-port]
    paths:
      - "qt_cockpit_windows.py"
      - "qt_cockpit.py"
      - "qt_cockpit_linux_premium.py"
      - "launch-windows.bat"
      - "windows/**"
      - "genesis/**"
      - ".github/workflows/windows-port.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements-windows.txt

      - name: Install runtime and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements-windows.txt
          python -m pip install pytest pyinstaller

      - name: Compile Windows entry points
        shell: pwsh
        run: |
          python -m py_compile qt_cockpit_windows.py qt_cockpit.py qt_cockpit_linux_premium.py
          python -m compileall -q genesis

      - name: Run portable backend tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_backend_routing.py tests/test_qt_media_picker.py tests/test_windows_safety.py

      - name: Verify offscreen Windows source launch
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
        run: |
          python -c "import subprocess,sys; from pathlib import Path; subprocess.run([sys.executable,'qt_cockpit_windows.py','--page','home','--screenshot','windows-source-smoke.png'],check=True,timeout=30); assert Path('windows-source-smoke.png').stat().st_size > 0"

      - name: Build GENESIS Windows folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name GENESIS-Windows `
            --add-data "genesis/qt_ui;genesis/qt_ui" `
            --add-data "genesis/assets;genesis/assets" `
            --add-data "genesis/reference;genesis/reference" `
            --add-data "database;database" `
            qt_cockpit_windows.py
          Copy-Item windows/README.md dist/GENESIS-Windows/README-WINDOWS.md
          Copy-Item launch-windows.bat dist/GENESIS-Windows/launch-source-version.bat

      - name: Verify offscreen packaged Windows launch
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QSG_RHI_BACKEND: software
        run: |
          python -c "import subprocess; from pathlib import Path; output=Path('windows-package-smoke.png').resolve(); subprocess.run(['dist/GENESIS-Windows/GENESIS-Windows.exe','--page','home','--screenshot',str(output)],check=True,timeout=45); assert output.stat().st_size > 0"

      - name: Archive portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GENESIS-Windows -DestinationPath GENESIS-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GENESIS-Windows
          path: GENESIS-Windows.zip
          if-no-files-found: error
          retention-days: 14
