name: G2 Studio bridge safety checks

on:
  pull_request:
    paths:
      - "genesis/g2_studio.py"
      - "qt_cockpit.py"
      - "genesis/qt_ui/MainPremiumLinux.qml"
      - "tests/test_g2_studio_integration.py"
      - ".github/workflows/g2-bridge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile G1 bridge modules
        run: python -m py_compile genesis/g2_studio.py qt_cockpit.py
      - name: Test isolated launch and UI coexistence
        run: python -m pytest --noconftest tests/test_g2_studio_integration.py -q
